name: 🧪 Test

on:
  push:
    branches:
      - main
      - beta
  pull_request: {}
  workflow_dispatch: {}

permissions: {}

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/beta' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Linters run in the background while dependencies are installed.
      # Uses the runner's preinstalled Node.js to read the secretlint version.
      - name: 🔍 Lint secrets
        id: lint-secrets
        background: true
        shell: bash
        run: |
          set -euo pipefail

          secretlint_version="$(node -p "require('./package.json').devDependencies.secretlint")"
          secretlint_version="${secretlint_version#^}"
          secretlint_version="${secretlint_version#~}"
          secretlint_version="${secretlint_version#v}"

          docker run --rm --network none \
            -v "${PWD}:${PWD}" -w "${PWD}" \
            "secretlint/secretlint:v${secretlint_version}" \
            secretlint --format github "**/*"

      - name: 🌈 Lint GitHub Actions
        id: lint-github-actions
        background: true
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "package.json"

      - name: 🗄 Cache node_modules
        id: cache-node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "**/node_modules"
          key: node_modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: 🗄 Cache .eslintcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "**/.eslintcache"
          # Unique key per commit so the cache is refreshed when code changes,
          # while restore-keys reuses the most recent previous cache as a base.
          key: eslintcache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslintcache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            eslintcache-${{ runner.os }}-

      - name: 🔍 Install dependencies
        if: steps.cache-node_modules.outputs.cache-hit != 'true'
        run: |
          npm ci --prefer-offline --no-audit

      # `.npmrc` sets `ignore-scripts=true`. In case there is
      # a build script, it must now get executed explicitly.
      - name: 📦 Build
        run: npm run build --if-present

      - name: 🧪 Run tests
        env:
          CI: true
        run: |
          npm test

      # Background step failures are only reported at a wait step
      - name: ⏳ Wait for linters
        wait: [lint-secrets, lint-github-actions]
